
name: Mirror Akeyless Gateway to GHCR

"on":
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  mirror:
    name: Copy and verify ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
        
          - name: akeyless-gateway
            source: docker.io/akeyless/gateway:5.4.0
            target: ghcr.io/howcodevops/akeyless-gateway:5.4.0

          - name: csi-secrets-store-driver
            source: registry.k8s.io/csi-secrets-store/driver:1.6.2
            target: ghcr.io/howcodevops/csi-secrets-store-driver:1.6.2

          - name: csi-secrets-store-driver-crds
            source: registry.k8s.io/csi-secrets-store/driver-crds:1.6.2
            target: ghcr.io/howcodevops/csi-secrets-store-driver-crds:1.6.2

          - name: sig-storage-csi-node-driver-registrar
            source: registry.k8s.io/sig-storage/csi-node-driver-registrar:2.16.0
            target: ghcr.io/howcodevops/sig-storage-csi-node-driver-registrar:2.16.0

          - name: sig-storage-livenessprobe
            source: registry.k8s.io/sig-storage/livenessprobe:2.18.0
            target: ghcr.io/howcodevops/sig-storage-livenessprobe:2.18.0

    env:
      SOURCE_IMAGE: ${{ matrix.source }}
      TARGET_IMAGE: ${{ matrix.target }}

    steps:
      - name: Install Skopeo
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y skopeo

      - name: Capture upstream manifest
        run: |
          set -euo pipefail

          skopeo inspect --raw "docker://${SOURCE_IMAGE}" \
            > "$RUNNER_TEMP/source-manifest.json"

          echo "Upstream manifest digest:"
          sha256sum "$RUNNER_TEMP/source-manifest.json"

      - name: Authenticate to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          AUTH_FILE="$RUNNER_TEMP/ghcr-auth.json"
          umask 077

          printf '%s' "$GH_TOKEN" |
            skopeo login ghcr.io \
              --username "$GITHUB_ACTOR" \
              --password-stdin \
              --authfile "$AUTH_FILE"

          echo "GHCR authentication succeeded."

      - name: Copy all architectures to GHCR
        run: |
          set -euo pipefail

          skopeo copy \
            --all \
            --preserve-digests \
            --retry-times 3 \
            --dest-authfile "$RUNNER_TEMP/ghcr-auth.json" \
            "docker://${SOURCE_IMAGE}" \
            "docker://${TARGET_IMAGE}"

      - name: Verify destination manifest
        run: |
          set -euo pipefail

          skopeo inspect --raw \
            --authfile "$RUNNER_TEMP/ghcr-auth.json" \
            "docker://${TARGET_IMAGE}" \
            > "$RUNNER_TEMP/destination-manifest.json"

          echo "Comparing upstream and destination manifests..."

          if ! cmp -s \
            "$RUNNER_TEMP/source-manifest.json" \
            "$RUNNER_TEMP/destination-manifest.json"; then
            echo "::error::Source and destination manifests differ."
            exit 1
          fi

          echo "Verified manifest digest:"
          sha256sum "$RUNNER_TEMP/destination-manifest.json"

          echo "Image mirror verification PASSED."

      - name: Remove temporary authentication file
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/ghcr-auth.json"
