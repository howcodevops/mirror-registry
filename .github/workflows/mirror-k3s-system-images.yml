name: Mirror K3s System Images to GHCR

"on":
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  mirror:
    name: Copy and verify ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: coredns
            source: rancher/mirrored-coredns-coredns:1.11.3
            target: ghcr.io/howcodevops/mirrored-coredns-coredns:1.11.3

          - name: klipper-helm
            source: rancher/klipper-helm:v0.9.2-build20240828
            target: ghcr.io/howcodevops/klipper-helm:v0.9.2-build20240828

          - name: local-path-provisioner
            source: rancher/local-path-provisioner:v0.0.28
            target: ghcr.io/howcodevops/local-path-provisioner:v0.0.28

          - name: metrics-server
            source: rancher/mirrored-metrics-server:v0.7.2
            target: ghcr.io/howcodevops/mirrored-metrics-server:v0.7.2

    env:
      SOURCE_IMAGE: ${{ matrix.source }}
      TARGET_IMAGE: ${{ matrix.target }}

    steps:
      - name: Install Skopeo
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y skopeo

      - name: Capture upstream manifest
        run: |
          set -euo pipefail
          skopeo inspect --raw "docker://${SOURCE_IMAGE}" \
            > "$RUNNER_TEMP/source-manifest.json"

          echo "Upstream manifest digest:"
          sha256sum "$RUNNER_TEMP/source-manifest.json"

      - name: Authenticate to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          AUTH_FILE="$RUNNER_TEMP/ghcr-auth.json"
          chmod 600 "$AUTH_FILE" 2>/dev/null || true

          printf '%s' "$GH_TOKEN" |
            skopeo login ghcr.io \
              --username "$GITHUB_ACTOR" \
              --password-stdin \
              --authfile "$AUTH_FILE"

          echo "GHCR authentication succeeded."

      - name: Copy all architectures to GHCR
        run: |
          set -euo pipefail

          skopeo copy \
            --all \
            --preserve-digests \
            --retry-times 3 \
            --dest-authfile "$RUNNER_TEMP/ghcr-auth.json" \
            "docker://${SOURCE_IMAGE}" \
            "docker://${TARGET_IMAGE}"

      - name: Verify destination manifest
        run: |
          set -euo pipefail

          skopeo inspect --raw \
            --authfile "$RUNNER_TEMP/ghcr-auth.json" \
            "docker://${TARGET_IMAGE}" \
            > "$RUNNER_TEMP/destination-manifest.json"

          echo "Comparing upstream and destination manifests..."

          if ! cmp -s \
            "$RUNNER_TEMP/source-manifest.json" \
            "$RUNNER_TEMP/destination-manifest.json"; then
            echo "::error::Source and destination manifests differ."
            exit 1
          fi

          echo "Verified manifest digest:"
          sha256sum "$RUNNER_TEMP/destination-manifest.json"

          echo "Image mirror verification PASSED."

      - name: Remove temporary authentication file
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/ghcr-auth.json"
