name: Mirror Monitoring Images to GHCR

"on":
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  mirror:
    name: Copy and verify ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: kube-state-metrics
            source: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.20.0
            target: ghcr.io/howcodevops/kube-state-metrics:v2.20.0

          # ── append new images below this line ────────────────────────
          # - name: busybox
          #   source: docker.io/library/busybox:1.38.0
          #   target: ghcr.io/howcodevops/busybox:1.38.0
          #
          - name: grafana
            source: docker.io/grafana/grafana:13.2.4-distroless
            target: ghcr.io/howcodevops/grafana:13.2.4-distroless
          #
          # - name: prometheus
          #   source: quay.io/prometheus/prometheus:v3.8.1
          #   target: ghcr.io/howcodevops/prometheus:v3.8.1
          #
          # - name: alertmanager
          #   source: quay.io/prometheus/alertmanager:v0.29.0
          #   target: ghcr.io/howcodevops/alertmanager:v0.29.0
          #
          # - name: prometheus-operator
          #   source: quay.io/prometheus-operator/prometheus-operator:v0.90.1
          #   target: ghcr.io/howcodevops/prometheus-operator:v0.90.1
          #
          # - name: prometheus-config-reloader
          #   source: quay.io/prometheus-operator/prometheus-config-reloader:v0.90.1
          #   target: ghcr.io/howcodevops/prometheus-config-reloader:v0.90.1
          #
          # - name: k8s-sidecar
          #   source: quay.io/kiwigrid/k8s-sidecar:1.28.4
          #   target: ghcr.io/howcodevops/k8s-sidecar:1.28.4

    env:
      SOURCE_IMAGE: ${{ matrix.source }}
      TARGET_IMAGE: ${{ matrix.target }}

    steps:
      - name: Install Skopeo
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y skopeo

      - name: Capture upstream manifest
        run: |
          set -euo pipefail
          skopeo inspect --raw "docker://${SOURCE_IMAGE}" \
            > "$RUNNER_TEMP/source-manifest.json"

          echo "Upstream manifest digest:"
          sha256sum "$RUNNER_TEMP/source-manifest.json"

      - name: Authenticate to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          AUTH_FILE="$RUNNER_TEMP/ghcr-auth.json"
          chmod 600 "$AUTH_FILE" 2>/dev/null || true

          printf '%s' "$GH_TOKEN" |
            skopeo login ghcr.io \
              --username "$GITHUB_ACTOR" \
              --password-stdin \
              --authfile "$AUTH_FILE"

          echo "GHCR authentication succeeded."

      - name: Copy all architectures to GHCR
        run: |
          set -euo pipefail

          skopeo copy \
            --all \
            --preserve-digests \
            --retry-times 3 \
            --dest-authfile "$RUNNER_TEMP/ghcr-auth.json" \
            "docker://${SOURCE_IMAGE}" \
            "docker://${TARGET_IMAGE}"

      - name: Verify destination manifest
        run: |
          set -euo pipefail

          skopeo inspect --raw \
            --authfile "$RUNNER_TEMP/ghcr-auth.json" \
            "docker://${TARGET_IMAGE}" \
            > "$RUNNER_TEMP/destination-manifest.json"

          echo "Comparing upstream and destination manifests..."

          if ! cmp -s \
            "$RUNNER_TEMP/source-manifest.json" \
            "$RUNNER_TEMP/destination-manifest.json"; then
            echo "::error::Source and destination manifests differ."
            exit 1
          fi

          echo "Verified manifest digest:"
          sha256sum "$RUNNER_TEMP/destination-manifest.json"

          echo "Image mirror verification PASSED."

      - name: Remove temporary authentication file
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/ghcr-auth.json"
